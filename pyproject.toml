[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmpa_decay_solver"
version = "0.1.0"
description = "Mini-Max Polynomial Approximation solver for matrix exponentials in decay chains"
readme = "README.md"
authors = [{ name = "Jullian J. Arredondo", email = "arredondojullianjoseph@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "memory-profiler>=0.60"]

[tool.pytest.ini_options]
pythonpath = ["."]
